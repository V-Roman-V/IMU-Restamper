# imu_restamper parameters (the values are the defaults). See README.md.
imu_restamper:
  ros__parameters:
    imu_in: /imu
    imu_out: /imu/restamped
    reliable_input: true    # false for best-effort publishers
    acc_scale: 1.0          # 9.80665 converts g (Livox) to m/s^2
    drop_duplicates: true   # drop samples identical to the previous one
    period: 0.005           # [s] nominal sample period
    creep: 1.0e-6           # [s per sample] must exceed how much slower than `period` the sensor runs
    max_gap: 0.1            # [s] quiet input -> warning; stamp jump -> grid restart
